<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Saieed Davis | Business Card</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#eef2f7;font-family:Arial,Helvetica,sans-serif}
.card{width:470px;min-height:285px;background:#fff;border-radius:18px;padding:32px 35px;position:relative;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.15)}
.card:before{content:"";position:absolute;top:0;left:0;width:9px;height:100%;background:#0b5ed7}
.name{font-size:30px;font-weight:700;color:#172033;margin-bottom:5px}
.credentials{font-size:17px;color:#0b5ed7;font-weight:700;margin-bottom:5px}
.profession{font-size:14px;color:#667085;line-height:1.5;margin-bottom:8px}
.experience{display:inline-block;background:#eef6ff;color:#0b5ed7;font-size:13px;font-weight:600;padding:6px 10px;border-radius:20px;margin-bottom:18px}
.divider{height:1px;background:#e4e7ec;margin-bottom:17px}
.contact{display:flex;flex-direction:column;gap:9px}
.contact div{font-size:14px;color:#475467}
.contact span{display:inline-block;width:72px;font-weight:700;color:#0b5ed7}
.contact a{color:#475467;text-decoration:none}
.footer{position:absolute;bottom:25px;right:32px;font-size:11px;font-weight:700;color:#98a2b3;text-transform:uppercase;letter-spacing:1.2px}
</style>
</head>
<body>
<div class="card">
  <div class="name">Dr. Saieed Davis</div>
  <div class="credentials">MD | MHA Candidate</div>
  <div class="profession">Medical Doctor | Healthcare Administration</div>
  <div class="experience">3 Years Clinical Experience</div>
  <div class="divider"></div>
  <div class="contact">
    <div><span>Phone:</span><a href="tel:0912759500">0912759500</a></div>
    <div><span>Email:</span><a href="mailto:saieeddavis@gmail.com">saieeddavis@gmail.com</a></div>
    <div><span>Location:</span>Taipei, Taiwan</div>
  </div>
  <div class="footer">Healthcare Professional</div>
</div>
</body>
</html>
